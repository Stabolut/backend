name: Manual Server Deployment

on:
  workflow_dispatch:
    inputs:
      target_server:
        description: 'Server Host/IP (leave empty to use repository secret SERVER_HOST)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ inputs.target_server != '' && inputs.target_server || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: /${{ secrets.SERVER_USERNAME }}/app

      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.target_server != '' && inputs.target_server || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /${{ secrets.SERVER_USERNAME }}/app && bash deploy_script.sh
